apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard-ingress
  namespace: kubernetes-dashboard
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"  # Redirect HTTP to HTTPS
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"  # Use HTTPS for communication with backend
spec:
  rules:
  - host: dashboard.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kubernetes-dashboard
            port:
              number: 443  # The Kubernetes dashboard is listening on port 443 (HTTPS)
  tls:
  - hosts:
    - dashboard.com
    secretName: kubernetes-dashboard-tls  # The TLS secret containing the certificate for the domain
 